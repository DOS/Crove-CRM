name: Publish Crove Apps to NPM

on:
  push:
    tags:
      - 'app/v*'
      - 'apps/v*'
  workflow_dispatch:
    inputs:
      app:
        description: 'Select app to publish'
        required: true
        type: choice
        options:
          - 'all'
          - 'commerce'
          - 'zalo-oa'
        default: 'all'

permissions:
  contents: read
  id-token: write # Required for NPM Trusted Publisher OIDC Provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @crove/commerce
        if: ${{ github.event.inputs.app == 'all' || github.event.inputs.app == 'commerce' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          npm publish packages/twenty-apps/public/commerce --access public --provenance

      - name: Publish @crove/zalo-oa
        if: ${{ github.event.inputs.app == 'all' || github.event.inputs.app == 'zalo-oa' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          npm publish packages/twenty-apps/public/zalo-oa --access public --provenance

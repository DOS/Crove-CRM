name: Upstream Release Auto-Sync

on:
  schedule:
    # Runs every 6 hours to check for new upstream releases
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Specific upstream tag to sync (e.g. twenty/v2.35.0). Leave empty to sync latest release.'
        required: false
        type: string
        default: ''
      target_branch:
        description: 'Target branch to merge into'
        required: false
        type: string
        default: 'dev'

jobs:
  sync-upstream:
    if: github.repository == 'DOS/Crove-CRM'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      # GITHUB_TOKEN is a GitHub App installation token that GitHub hard-blocks
      # from creating or updating .github/workflows/* - no job permission lifts
      # it, and `workflows` is not even a valid permissions key. Upstream release
      # merges routinely touch those files. The DOS GitHub App (slug `dos`, id
      # 4711427) holds Contents + Workflows + Pull requests write and is not
      # subject to that block; this is the same pattern the inherited upstream
      # workflows use. Unconditional on purpose: `secrets` is not a valid context
      # in a step-level `if`, so guarding on it fails to parse, and a missing key
      # should fail loudly here rather than later at the push.
      - name: Mint sync app token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CROVE_SYNC_APP_ID }}
          private-key: ${{ secrets.CROVE_SYNC_APP_PRIVATE_KEY }}
          owner: DOS
          repositories: Crove-CRM

      - name: Checkout target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_branch || 'dev' }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Determine Upstream Release Tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECIFIC_TAG: ${{ inputs.upstream_tag }}
        run: |
          if [ -n "$SPECIFIC_TAG" ]; then
            TAG="$SPECIFIC_TAG"
          else
            # Fetch the latest release tag from twentyhq/twenty that starts with twenty/v
            TAG=$(gh api repos/twentyhq/twenty/releases --jq '[.[] | select(.tag_name | startswith("twenty/v"))] | .[0].tag_name')
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No valid upstream release tag found."
            exit 1
          fi

          echo "Selected upstream release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          CLEAN_VER="${TAG#twenty/}"
          echo "clean_version=$CLEAN_VER" >> "$GITHUB_OUTPUT"

      - name: Check if Tag Already Merged
        id: check_merged
        run: |
          git remote add upstream https://github.com/twentyhq/twenty.git || true
          git fetch upstream --tags

          TAG="${{ steps.get_tag.outputs.tag }}"

          if git merge-base --is-ancestor "$TAG" HEAD 2>/dev/null; then
            echo "Upstream tag $TAG is already merged into HEAD."
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream tag $TAG is NOT merged yet."
            echo "already_merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git Author
        if: steps.check_merged.outputs.already_merged == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Upstream Tag Into A Review Branch
        if: steps.check_merged.outputs.already_merged == 'false'
        id: merge
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
          TARGET_BRANCH: ${{ inputs.target_branch || 'dev' }}
        run: |
          echo "Merging $TAG into a review branch for $TARGET_BRANCH..."

          # Never push a merge straight to $TARGET_BRANCH. A clean textual merge
          # still hides upstream renames that land inside fork-only files - git
          # reports no conflict because only one side changed. The v2.39.0 sync
          # had three of those, one being a TypeORM relation string that tsgo
          # cannot check and that only throws at runtime.
          SYNC_BRANCH="sync/${TAG//\//-}"
          git checkout -b "$SYNC_BRANCH"

          if git merge --no-commit "$TAG"; then
            MERGE_KIND="clean"

            if [ -f "packages/twenty-utils/patch-crove-branding.ts" ]; then
              # This job never runs yarn install, so `yarn tsx` cannot resolve and
              # used to no-op silently behind `|| true`. Warn loudly instead of
              # dying: rebranding the .po files is cosmetic and must not block
              # the sync branch.
              npx --yes tsx@4.21.0 packages/twenty-utils/patch-crove-branding.ts ||
                echo "::warning::patch-crove-branding failed; .po files left unpatched in this sync commit"
            fi

            git commit -m "chore(sync): merge upstream release $TAG into $TARGET_BRANCH"
          else
            MERGE_KIND="conflict"

            # Keep genuine conflicts: -X ours would silently drop the upstream side
            # of every conflicted file, producing a branch that looks merged while
            # losing upstream changes. A human resolves the real conflicts in the PR.
            git add -A
            git commit -m "chore(sync): automated sync branch for upstream release $TAG (requires review)"
          fi

          git push -f origin "$SYNC_BRANCH"

          echo "merge_kind=$MERGE_KIND" >> "$GITHUB_OUTPUT"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check_merged.outputs.already_merged == 'false'
        env:
          # App token, not GITHUB_TOKEN: GitHub does not fire pull_request
          # workflows for PRs opened by GITHUB_TOKEN, so the sync PR would run
          # no CI at all and the merge would get reviewed unverified.
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TAG: ${{ steps.get_tag.outputs.tag }}
          SYNC_BRANCH: ${{ steps.merge.outputs.sync_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch || 'dev' }}
          MERGE_KIND: ${{ steps.merge.outputs.merge_kind }}
        run: |
          {
            echo "Automated sync from upstream **twentyhq/twenty** release **$TAG**."
            echo ""
            if [ "$MERGE_KIND" = "conflict" ]; then
              echo "### Conflict resolution required"
              echo ""
              echo "The merge into $TARGET_BRANCH conflicted. This branch carries the real conflict markers - resolve them, do not force-push over them."
            else
              echo "### Clean textual merge - review still required"
              echo ""
              echo "Git merged this with no conflicts, which does not make it correct: an upstream rename landing inside a fork-only file produces no conflict at all. The v2.39.0 sync had three such cases, one of them a TypeORM relation string that tsgo cannot check and that only throws at runtime."
            fi
            echo ""
            echo "**Check before merging:**"
            echo ""
            echo '```bash'
            echo "git checkout $SYNC_BRANCH"
            echo 'npx nx build twenty-shared --skip-nx-cache'
            echo 'npx tsgo -p packages/twenty-server/tsconfig.json --noEmit'
            echo 'git grep -n "signInUpWithSocialSSO\|SSOExchangeTokenService\|workspaceSSOIdentityProviders" -- packages'
            echo '```'
            echo ""
            echo "Merging this PR is what pushes $TARGET_BRANCH, and therefore what triggers the docker-publish verify gate and the beta image build."
          } > /tmp/pr-body.md

          # Self-heal the label: when it was missing, `gh pr create` exited
          # non-zero and the old `|| echo` fallback reported success without
          # ever opening a PR.
          gh label create "upstream-sync" \
            --color 0366d6 \
            --description "Automated upstream release sync" || true

          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Open PR #$EXISTING_PR already carries $SYNC_BRANCH; not creating a duplicate."
            exit 0
          fi

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "[Upstream Sync] Merge $TAG into $TARGET_BRANCH ($MERGE_KIND merge)" \
            --body-file /tmp/pr-body.md \
            --label "upstream-sync"
